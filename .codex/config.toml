# ─────────────────────────────────────────────────────────────────────────────
# Конфигурация Codex для проекта reelcraft — ОБРАЗЕЦ, а не готовая настройка.
#
# Прочитай файл целиком перед тем, как им пользоваться. Он раздаёт агенту
# постоянное разрешение на действия без повторных вопросов — это удобно, когда
# ролик собирается час подряд, но это твоё решение о своей машине, а не наше.
# Не согласен с каким-то пунктом — убери его, конвейер от этого не сломается.
#
# Что обязательно поправить под себя:
#   1) model — модель, которая у тебя реально доступна;
#   2) writable_roots — твоя папка вывода роликов (та же, что CHANNEL.outputDir
#      в engine/src/channel.ts). Пример ниже заведомо чужой: его надо заменить.
# ─────────────────────────────────────────────────────────────────────────────

model = "gpt-6-astra"
model_reasoning_effort = "high"

# Постоянное разрешение на рабочий процесс сборки ролика.
# Хочешь подтверждать каждый шаг — поставь approval_policy = "untrusted".
approval_policy = "on-request"
sandbox_mode = "workspace-write"
developer_instructions = '''
Пользователь заранее разрешил обычные действия, необходимые для создания и исправления роликов Reelcraft. Не запрашивай повторного согласия на каждый инструмент, команду или этап. Доводи заказанный ролик до готового проверенного MP4 самостоятельно.
Без дополнительного вопроса разрешены: чтение нужных материалов; работа с файлами текущего ролика; транскрибация; подбор и загрузка ассетов; штатная генерация ассетов; сториборд; монтаж и код сцен; запуск штатных скриптов, локальных сервисов предпросмотра и инструментов; установка уже объявленных зависимостей без изменения манифестов и lock-файлов; проверки, рендер, исправления, повторный рендер, мастеринг и экспорт в папку вывода из engine/src/channel.ts (CHANNEL.outputDir). Разрешены обычные записи в журналы конвейера и добавление регистрации текущей композиции в engine/src/Root.tsx без изменения общей логики и чужих композиций.
Согласование обязательно перед изменением файлов непосредственно в корне проекта; общих инструкций, навыков, настроек Codex, конфигурации канала, общей архитектуры, компонентов и инфраструктуры рендера; обновлением зависимостей; системной установкой ПО; удалением исходников, слотов или пользовательских материалов; перезаписью чужих результатов; публикацией, отправкой сообщений, push, платежами или новыми платными обязательствами. Если конкретное действие уже прямо согласовано пользователем в текущей задаче, повторно согласие не спрашивай.
Временные файлы, созданные тобой для текущей задачи и не нужные для воспроизведения результата, можно удалять без отдельного вопроса после проверки точного пути. Полная чистка слота, исходников и архива требует согласования.
Чтение корневых и общих файлов разрешено. Рутинный выбор реализации, переход между этапами и исправление ошибок текущего ролика не являются важными изменениями. Обязательные проверки качества сохраняются.
Это разрешение пользователя на рабочий процесс не отменяет технических ограничений среды, политик организации и обязательных запросов инструментов. Если инструмент требует подтверждения, кратко объясни конкретную причину; не обещай, что системные запросы полностью отключены. Не меняй общие настройки компьютера и других проектов для обхода ограничений.
'''

[sandbox_workspace_write]
network_access = true
# ЗАМЕНИ на свою папку вывода роликов — ту же, что CHANNEL.outputDir в
# engine/src/channel.ts. Она лежит вне репозитория (ролики весят 10–30 МБ),
# поэтому песочнице нужно разрешить запись в неё отдельно.
writable_roots = ['/путь/к/папке/роликов']
